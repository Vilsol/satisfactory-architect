name: UI to Cloudflare Pages

on:
  push:
    paths:
      - "ui/**"
      - "server/shared/**"
      - ".github/workflows/ui-pages.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      # The UI type-checks against server/shared, so the whole repo has to be here.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        working-directory: ui
        run: npm ci

      - name: Typecheck
        working-directory: ui
        run: npm run check

      - name: Test
        working-directory: ui
        run: npm test

      - name: Build
        working-directory: ui
        env:
          # Which collaboration server this build talks to. Leave the variable unset to
          # fall back to "same host as the page", which a static host cannot serve.
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
        run: npm run build

      # Pages decides production purely by branch name: a deployment is production when
      # the branch it names is the project's production branch, and a preview otherwise.
      # There is no flag for it. So a push to master deploys under whatever name the
      # project calls production, and every other branch deploys under its own.
      - name: Work out which branch to deploy as
        id: target
        run: |
          production_branch="${{ vars.CF_PAGES_PRODUCTION_BRANCH || 'master' }}"
          if [ "${GITHUB_REF_NAME}" = "master" ]; then
            echo "branch=${production_branch}" >> "$GITHUB_OUTPUT"
            echo "Deploying to production as '${production_branch}'"
          else
            echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "Deploying as a preview of '${GITHUB_REF_NAME}'"
          fi

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=${{ vars.CF_PAGES_PROJECT || 'satisfactory-architect' }} --branch=${{ steps.target.outputs.branch }}
          workingDirectory: ui
