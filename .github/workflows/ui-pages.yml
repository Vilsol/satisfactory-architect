name: UI to Cloudflare Pages

on:
  push:
    paths:
      - "ui/**"
      - "server/shared/**"
      - ".github/workflows/ui-pages.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      # The UI type-checks against server/shared, so the whole repo has to be here.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        working-directory: ui
        run: npm ci

      - name: Typecheck
        working-directory: ui
        run: npm run check

      - name: Test
        working-directory: ui
        run: npm test

      - name: Build
        working-directory: ui
        env:
          # Which collaboration server this build talks to. Leave the variable unset to
          # fall back to "same host as the page", which a static host cannot serve.
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
        run: npm run build

      # Pages decides production purely by branch name: a deployment is production when
      # the branch it names is the project's production branch, and a preview otherwise.
      # There is no flag for it, and no error if the name does not match - the deploy
      # succeeds and quietly lands on a preview URL.
      #
      # So rather than assume what the project calls production, ask it.
      - name: Ask the project which branch is production
        id: target
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CF_PAGES_PROJECT || 'satisfactory-architect' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]; then
            echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "Preview of '${GITHUB_REF_NAME}'."
            exit 0
          fi

          production=$(curl -sf \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/${PROJECT}" \
            | jq -r ".result.production_branch // empty") || true

          if [ -z "${production}" ]; then
            echo "::error::Could not read the production branch of Pages project '${PROJECT}'." \
              "The API token needs read access to Pages. Refusing to deploy, because deploying" \
              "under the wrong name would silently publish to a preview URL instead."
            exit 1
          fi

          echo "branch=${production}" >> "$GITHUB_OUTPUT"
          echo "Production. The project calls its production branch '${production}'."

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=${{ vars.CF_PAGES_PROJECT || 'satisfactory-architect' }} --branch=${{ steps.target.outputs.branch }}
          workingDirectory: ui
